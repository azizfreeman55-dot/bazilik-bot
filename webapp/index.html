<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bazilik Catering</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --green-50: #EAF3DE;
    --green-100: #C0DD97;
    --green-600: #2D5F3E;
    --green-700: #234A31;
    --green-800: #1A3824;
    --cream: #FAF7F0;
    --cream-dark: #F0EBE0;
    --coral: #D4724A;
    --coral-dark: #A8552F;
    --ink: #2B2620;
    --ink-soft: #6B6356;
    --line: rgba(43,38,32,0.1);
    --white: #FFFFFF;
    --red: #C0392B;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--cream);
    color: var(--ink);
    padding-bottom: 80px;
    -webkit-font-smoothing: antialiased;
  }

  .header {
    background: var(--green-600);
    color: var(--cream);
    padding: 20px 18px 24px;
    border-radius: 0 0 20px 20px;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: "";
    position: absolute;
    right: -30px;
    top: -30px;
    width: 140px;
    height: 140px;
    background: var(--green-700);
    border-radius: 50%;
    opacity: 0.5;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--green-100); display: flex;
    align-items: center; justify-content: center; font-size: 18px;
  }
  .brand-name { font-size: 15px; font-weight: 600; }
  .brand-sub { font-size: 11px; opacity: 0.75; margin-top: 1px; }
  .balance-pill {
    background: rgba(255,255,255,0.12); border-radius: 999px;
    padding: 6px 12px; font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .header-sub {
    margin-top: 18px; position: relative; z-index: 1;
  }
  .header-sub-label { font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.6px; }
  .header-sub-value { font-size: 22px; font-weight: 700; margin-top: 2px; }

  .page { padding: 16px 18px; display: none; }
  .page.active { display: block; }

  .tabs {
    display: flex; gap: 6px; padding: 16px 18px 4px;
    overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; padding: 9px 16px; border-radius: 999px;
    background: var(--white); border: 1px solid var(--line);
    font-size: 13px; font-weight: 600; color: var(--ink-soft);
    display: flex; align-items: center; gap: 6px;
  }
  .tab.active { background: var(--green-600); color: var(--cream); border-color: var(--green-600); }
  .tab-count { background: rgba(0,0,0,0.08); border-radius: 999px; font-size: 10px; padding: 1px 6px; font-weight: 700; }
  .tab.active .tab-count { background: rgba(255,255,255,0.22); }

  .list { padding: 12px 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .item-card {
    background: var(--white); border-radius: 16px; border: 1px solid var(--line);
    padding: 12px; display: flex; gap: 12px; align-items: center;
  }
  .item-thumb {
    width: 56px; height: 56px; border-radius: 12px; background: var(--cream-dark);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
  .item-price { font-size: 13px; color: var(--ink-soft); margin-top: 2px; font-weight: 500; }
  .stepper { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .step-btn {
    width: 30px; height: 30px; border-radius: 10px; border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 600; cursor: pointer;
  }
  .step-minus { background: var(--cream-dark); color: var(--ink); }
  .step-plus { background: var(--green-600); color: var(--cream); }
  .step-plus.add { width: auto; padding: 0 14px; border-radius: 999px; font-size: 13px; }
  .step-qty { font-size: 15px; font-weight: 700; min-width: 18px; text-align: center; }

  .empty-state { text-align: center; padding: 50px 20px; color: var(--ink-soft); }
  .empty-state-icon { font-size: 36px; margin-bottom: 8px; }
  .empty-state-text { font-size: 14px; }

  .cart-bar {
    position: fixed; left: 14px; right: 14px; bottom: 76px;
    background: var(--green-700); border-radius: 18px; padding: 14px 18px;
    display: none; align-items: center; justify-content: space-between;
    box-shadow: 0 8px 24px rgba(35,74,49,0.35); z-index: 100;
  }
  .cart-bar.visible { display: flex; }
  .cart-info { color: var(--cream); }
  .cart-count { font-size: 11px; opacity: 0.75; }
  .cart-total { font-size: 17px; font-weight: 700; margin-top: 1px; }
  .cart-action {
    background: var(--coral); color: var(--white); border: none; border-radius: 12px;
    padding: 11px 18px; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; gap: 6px; cursor: pointer;
  }

  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: var(--ink); color: var(--cream); padding: 10px 18px; border-radius: 12px;
    font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.25s ease; z-index: 200; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .loading { text-align: center; padding: 60px 20px; color: var(--ink-soft); font-size: 14px; }

  .navbar {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--white);
    border-top: 1px solid var(--line); display: flex; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    z-index: 90;
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 0; background: none; border: none; color: var(--ink-soft);
    font-size: 11px; font-weight: 600; cursor: pointer;
  }
  .nav-btn.active { color: var(--green-600); }
  .nav-icon { font-size: 20px; }

  .order-card {
    background: var(--white); border-radius: 16px; border: 1px solid var(--line);
    padding: 16px; margin-bottom: 12px;
  }
  .order-cat-label { font-size: 12px; font-weight: 600; color: var(--ink-soft); margin: 12px 0 6px; }
  .order-cat-label:first-child { margin-top: 0; }
  .order-item-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .order-total-row {
    display: flex; justify-content: space-between; font-size: 16px; font-weight: 700;
    padding-top: 12px; margin-top: 8px; border-top: 1px solid var(--line);
  }
  .btn-primary {
    width: 100%; background: var(--green-600); color: var(--cream); border: none;
    border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px;
  }
  .btn-danger {
    width: 100%; background: var(--white); color: var(--red); border: 1px solid var(--red);
    border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 8px;
  }

  .profile-card {
    background: var(--white); border-radius: 16px; border: 1px solid var(--line);
    padding: 18px; margin-bottom: 12px;
  }
  .profile-name { font-size: 17px; font-weight: 700; }
  .profile-sub { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .profile-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .stat-box { background: var(--cream-dark); border-radius: 12px; padding: 12px; text-align: center; }
  .stat-value { font-size: 18px; font-weight: 700; color: var(--green-700); }
  .stat-label { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

  .balance-hero {
    background: var(--green-600); color: var(--cream); border-radius: 16px;
    padding: 20px; text-align: center; margin-bottom: 12px;
  }
  .balance-hero-label { font-size: 12px; opacity: 0.75; }
  .balance-hero-value { font-size: 28px; font-weight: 700; margin-top: 4px; }

  .history-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .history-row:last-child { border-bottom: none; }
  .history-desc { color: var(--ink); }
  .history-date { color: var(--ink-soft); font-size: 11px; margin-top: 1px; }
  .history-amount.credit { color: var(--green-700); font-weight: 700; }
  .history-amount.debit { color: var(--red); font-weight: 700; }

  .rating-row {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    background: var(--white); border-radius: 14px; border: 1px solid var(--line); margin-bottom: 8px;
  }
  .rating-rank {
    width: 28px; height: 28px; border-radius: 50%; background: var(--cream-dark);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .rating-rank.top1 { background: var(--green-100); color: var(--green-800); }
  .rating-name { flex: 1; font-size: 14px; font-weight: 600; }
  .rating-count { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
</style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-mark">🌿</div>
        <div>
          <div class="brand-name">Bazilik Catering</div>
          <div class="brand-sub" id="header-sub-text">Обеды для офиса</div>
        </div>
      </div>
      <div class="balance-pill" id="balance-pill">— сум</div>
    </div>
    <div class="header-sub" id="header-extra"></div>
  </div>

  <!-- MENU PAGE -->
  <div class="page active" id="page-menu">
    <div id="tabs" class="tabs"></div>
    <div id="menu-list" class="list">
      <div class="loading">Загружаем меню…</div>
    </div>
  </div>

  <!-- MY ORDER PAGE -->
  <div class="page" id="page-order">
    <div style="padding: 4px 0 12px;">
      <div id="order-content"><div class="loading">Загружаем заказ…</div></div>
    </div>
  </div>

  <!-- PROFILE PAGE -->
  <div class="page" id="page-profile">
    <div id="profile-content"><div class="loading">Загружаем профиль…</div></div>
  </div>

  <!-- BALANCE PAGE -->
  <div class="page" id="page-balance">
    <div id="balance-content"><div class="loading">Загружаем баланс…</div></div>
  </div>

  <!-- RATING PAGE -->
  <div class="page" id="page-rating">
    <div id="rating-content"><div class="loading">Загружаем рейтинг…</div></div>
  </div>

  <div class="cart-bar" id="cart-bar">
    <div class="cart-info">
      <div class="cart-count" id="cart-count">0 позиций</div>
      <div class="cart-total" id="cart-total">0 сум</div>
    </div>
    <button class="cart-action" id="cart-action">
      Оформить заказ <span>→</span>
    </button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="navbar">
    <button class="nav-btn active" data-page="menu">
      <span class="nav-icon">🍽️</span>Меню
    </button>
    <button class="nav-btn" data-page="order">
      <span class="nav-icon">📝</span>Заказ
    </button>
    <button class="nav-btn" data-page="profile">
      <span class="nav-icon">👤</span>Профиль
    </button>
    <button class="nav-btn" data-page="balance">
      <span class="nav-icon">💳</span>Баланс
    </button>
    <button class="nav-btn" data-page="rating">
      <span class="nav-icon">🏆</span>Рейтинг
    </button>
  </div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const CATEGORY_META = {
    main:    { label: "Основные",  icon: "🍱" },
    salad:   { label: "Салаты",    icon: "🥗" },
    dessert: { label: "Десерты",   icon: "🍰" },
    drink:   { label: "Напитки",   icon: "🥤" },
  };

  const API_BASE = "https://bazilik-webhook.onrender.com";

  let MENU = {};
  let currentCat = "main";
  let cart = {};
  let userBalance = 0;
  let currentPage = "menu";

  function fmt(n) { return Math.round(n).toLocaleString("ru-RU") + " сум"; }

  function showToast(text) {
    const toast = document.getElementById("toast");
    toast.textContent = text;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
  }

  async function apiCall(endpoint, body) {
    const initData = tg?.initData || "";
    const res = await fetch(`${API_BASE}${endpoint}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-Init-Data": initData
      },
      body: JSON.stringify(body || {})
    });
    return res.json();
  }

  // ─── Navigation ────────────────────────────────────────────────────────────

  function switchPage(page) {
    currentPage = page;
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(`page-${page}`).classList.add("active");
    document.querySelectorAll(".nav-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.page === page);
    });

    const cartBar = document.getElementById("cart-bar");
    if (page !== "menu") {
      cartBar.classList.remove("visible");
    } else {
      renderCart();
    }

    if (page === "menu" && Object.keys(MENU).length === 0) loadMenu();
    if (page === "order") loadMyOrder();
    if (page === "profile") loadProfile();
    if (page === "balance") loadBalance();
    if (page === "rating") loadRating();
  }

  document.querySelectorAll(".nav-btn").forEach(btn => {
    btn.addEventListener("click", () => switchPage(btn.dataset.page));
  });

  // ─── MENU PAGE ──────────────────────────────────────────────────────────────

  async function loadMenu() {
    try {
      const data = await apiCall("/api/menu");

      if (data.error) {
        document.getElementById("menu-list").innerHTML =
          `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">${data.error}</div></div>`;
        return;
      }

      MENU = data.categories || {};
      userBalance = data.balance || 0;
      document.getElementById("balance-pill").textContent = fmt(userBalance);

      const dateLabel = data.date_label || "завтра";
      document.getElementById("header-extra").innerHTML =
        `<div class="header-sub-label">Меню на</div><div class="header-sub-value">${dateLabel}</div>`;

      const availableCats = Object.keys(MENU).filter(c => MENU[c].length > 0);
      if (availableCats.length === 0) {
        document.getElementById("menu-list").innerHTML =
          '<div class="empty-state"><div class="empty-state-icon">🍽️</div><div class="empty-state-text">Меню на эту дату ещё не добавлено</div></div>';
        return;
      }

      currentCat = availableCats.includes("main") ? "main" : availableCats[0];
      renderTabs(availableCats);
      renderMenuList();
    } catch (e) {
      document.getElementById("menu-list").innerHTML =
        '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">Не удалось загрузить меню</div></div>';
    }
  }

  function renderTabs(cats) {
    const tabsEl = document.getElementById("tabs");
    tabsEl.innerHTML = "";
    cats.forEach(cat => {
      const meta = CATEGORY_META[cat] || { label: cat, icon: "🍽" };
      const btn = document.createElement("button");
      btn.className = "tab" + (cat === currentCat ? " active" : "");
      btn.innerHTML = `${meta.icon} ${meta.label} <span class="tab-count">${MENU[cat].length}</span>`;
      btn.onclick = () => { currentCat = cat; renderTabs(cats); renderMenuList(); };
      tabsEl.appendChild(btn);
    });
  }

  function renderMenuList() {
    const listEl = document.getElementById("menu-list");
    const items = MENU[currentCat] || [];
    listEl.innerHTML = "";

    if (items.length === 0) {
      listEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🍽️</div><div class="empty-state-text">В этой категории пока пусто</div></div>';
      return;
    }

    items.forEach(item => {
      const qty = cart[item.id]?.qty || 0;
      const card = document.createElement("div");
      card.className = "item-card";
      card.innerHTML = `
        <div class="item-thumb">${CATEGORY_META[currentCat]?.icon || "🍽"}</div>
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-price">${fmt(item.price)}</div>
        </div>
        <div class="stepper" id="stepper-${item.id}"></div>
      `;
      listEl.appendChild(card);
      renderStepper(item, qty);
    });
  }

  function renderStepper(item, qty) {
    const el = document.getElementById(`stepper-${item.id}`);
    if (qty === 0) {
      el.innerHTML = `<button class="step-plus add" data-id="${item.id}">+ Добавить</button>`;
    } else {
      el.innerHTML = `
        <button class="step-btn step-minus" data-id="${item.id}" data-action="dec">−</button>
        <span class="step-qty">${qty}</span>
        <button class="step-btn step-plus" data-id="${item.id}" data-action="inc">+</button>
      `;
    }
    el.querySelectorAll("button").forEach(btn => {
      btn.onclick = () => handleStep(item, btn.dataset.action || "inc");
    });
  }

  function handleStep(item, action) {
    if (!cart[item.id]) cart[item.id] = { item, qty: 0, category: currentCat };
    if (action === "inc") {
      cart[item.id].qty += 1;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
    } else {
      cart[item.id].qty -= 1;
      if (cart[item.id].qty <= 0) delete cart[item.id];
    }
    renderMenuList();
    renderCart();
  }

  function renderCart() {
    let count = 0, total = 0;
    Object.values(cart).forEach(c => { count += c.qty; total += c.qty * c.item.price; });
    const bar = document.getElementById("cart-bar");
    if (count === 0 || currentPage !== "menu") { bar.classList.remove("visible"); return; }
    bar.classList.add("visible");
    document.getElementById("cart-count").textContent = count === 1 ? "1 позиция" : `${count} позиций`;
    document.getElementById("cart-total").textContent = fmt(total);
  }

  async function submitOrder() {
    const items = Object.values(cart).map(c => ({ menu_id: c.item.id, qty: c.qty, category: c.category }));
    if (items.length === 0) return;

    const total = Object.values(cart).reduce((s, c) => s + c.qty * c.item.price, 0);
    if (total > userBalance) showToast("Недостаточно баланса — оплата при получении");

    document.getElementById("cart-action").textContent = "Отправляем…";

    try {
      const result = await apiCall("/api/order", { items });
      if (result.success) {
        cart = {};
        renderCart();
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
        showToast("✅ Заказ оформлен!");
        loadMenu();
        document.getElementById("cart-action").innerHTML = "Оформить заказ <span>→</span>";
        switchPage("order");
      } else {
        showToast(result.error || "Ошибка оформления заказа");
        document.getElementById("cart-action").innerHTML = "Оформить заказ <span>→</span>";
      }
    } catch (e) {
      showToast("Ошибка соединения");
      document.getElementById("cart-action").innerHTML = "Оформить заказ <span>→</span>";
    }
  }

  document.getElementById("cart-action").addEventListener("click", submitOrder);

  // ─── ORDER PAGE ─────────────────────────────────────────────────────────────

  async function loadMyOrder() {
    const el = document.getElementById("order-content");
    el.innerHTML = '<div class="loading">Загружаем заказ…</div>';
    try {
      const data = await apiCall("/api/my-order");
      if (!data.items || data.items.length === 0) {
        el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📝</div><div class="empty-state-text">У вас пока нет заказа на ${data.date_label || "завтра"}</div></div>`;
        return;
      }

      const byCategory = {};
      data.items.forEach(item => {
        const cat = item.category || "main";
        (byCategory[cat] = byCategory[cat] || []).push(item);
      });

      let html = `<div class="order-card">`;
      for (const [cat, items] of Object.entries(byCategory)) {
        const meta = CATEGORY_META[cat] || { label: cat, icon: "🍽" };
        html += `<div class="order-cat-label">${meta.icon} ${meta.label}</div>`;
        items.forEach(item => {
          html += `<div class="order-item-row"><span>${item.meal_name}</span><span>${fmt(item.price)}</span></div>`;
        });
      }
      html += `<div class="order-total-row"><span>Итого</span><span>${fmt(data.total)}</span></div>`;
      html += `</div>`;

      const status = data.items[0]?.status || "pending";
      if (status === "pending") {
        html += `<button class="btn-primary" id="edit-order-btn">Изменить заказ</button>`;
        html += `<button class="btn-danger" id="cancel-order-btn">Отменить весь заказ</button>`;
      }

      el.innerHTML = html;

      const editBtn = document.getElementById("edit-order-btn");
      if (editBtn) editBtn.onclick = () => switchPage("menu");

      const cancelBtn = document.getElementById("cancel-order-btn");
      if (cancelBtn) cancelBtn.onclick = () => confirmCancelOrder();

    } catch (e) {
      el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">Не удалось загрузить заказ</div></div>';
    }
  }

  function confirmCancelOrder() {
    if (tg?.showConfirm) {
      tg.showConfirm("Точно отменить весь заказ?", (confirmed) => {
        if (confirmed) doCancelOrder();
      });
    } else {
      if (confirm("Точно отменить весь заказ?")) doCancelOrder();
    }
  }

  async function doCancelOrder() {
    try {
      const result = await apiCall("/api/cancel-order");
      if (result.success) {
        showToast(result.refund_amount > 0 ? `✅ Отменено. +${fmt(result.refund_amount)} на баланс` : "✅ Заказ отменён");
        loadMyOrder();
      } else {
        showToast(result.error || "Ошибка отмены");
      }
    } catch (e) {
      showToast("Ошибка соединения");
    }
  }

  // ─── PROFILE PAGE ───────────────────────────────────────────────────────────

  async function loadProfile() {
    const el = document.getElementById("profile-content");
    el.innerHTML = '<div class="loading">Загружаем профиль…</div>';
    try {
      const data = await apiCall("/api/profile");
      if (data.error) {
        el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">${data.error}</div></div>`;
        return;
      }

      el.innerHTML = `
        <div class="profile-card">
          <div class="profile-name">${data.full_name || "—"}</div>
          <div class="profile-sub">${data.company_name || "Компания не указана"}</div>
          <div class="profile-sub">📱 ${data.phone ? "+" + data.phone : "—"}</div>
          <div class="profile-stats">
            <div class="stat-box"><div class="stat-value">${data.total_orders}</div><div class="stat-label">Заказов</div></div>
            <div class="stat-box"><div class="stat-value">${data.points}</div><div class="stat-label">Баллов</div></div>
          </div>
          <div style="margin-top: 10px; text-align: center; font-size: 13px; color: var(--ink-soft);">
            🏅 ${data.status || "Новый"}
          </div>
        </div>
        <div class="profile-card">
          <div style="font-size: 13px; color: var(--ink-soft); margin-bottom: 4px;">Код для приглашения друзей</div>
          <div style="font-size: 18px; font-weight: 700; letter-spacing: 1px;">${data.referral_code || "—"}</div>
        </div>
      `;
    } catch (e) {
      el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">Не удалось загрузить профиль</div></div>';
    }
  }

  // ─── BALANCE PAGE ───────────────────────────────────────────────────────────

  async function loadBalance() {
    const el = document.getElementById("balance-content");
    el.innerHTML = '<div class="loading">Загружаем баланс…</div>';
    try {
      const data = await apiCall("/api/balance-history");
      if (data.error) {
        el.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">${data.error}</div></div>`;
        return;
      }

      let html = `
        <div class="balance-hero">
          <div class="balance-hero-label">Ваш баланс</div>
          <div class="balance-hero-value">${fmt(data.balance)}</div>
        </div>
        <div class="profile-card">
          <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;">История операций</div>
      `;

      if (!data.history || data.history.length === 0) {
        html += `<div style="color: var(--ink-soft); font-size: 13px; padding: 8px 0;">Операций пока нет</div>`;
      } else {
        data.history.forEach(h => {
          const sign = h.type === "credit" ? "+" : "−";
          html += `
            <div class="history-row">
              <div>
                <div class="history-desc">${h.description}</div>
                <div class="history-date">${h.date}</div>
              </div>
              <div class="history-amount ${h.type}">${sign}${fmt(h.amount)}</div>
            </div>
          `;
        });
      }
      html += `</div>`;
      el.innerHTML = html;
    } catch (e) {
      el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">Не удалось загрузить баланс</div></div>';
    }
  }

  // ─── RATING PAGE ────────────────────────────────────────────────────────────

  async function loadRating() {
    const el = document.getElementById("rating-content");
    el.innerHTML = '<div class="loading">Загружаем рейтинг…</div>';
    try {
      const data = await apiCall("/api/rating");
      const companies = data.companies || [];

      if (companies.length === 0) {
        el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🏆</div><div class="empty-state-text">Рейтинг пока пуст</div></div>';
        return;
      }

      let html = "";
      companies.forEach((c, i) => {
        const rank = i + 1;
        html += `
          <div class="rating-row">
            <div class="rating-rank ${rank === 1 ? "top1" : ""}">${rank}</div>
            <div class="rating-name">${c.name}</div>
            <div class="rating-count">${c.month_orders} зак.</div>
          </div>
        `;
      });
      el.innerHTML = html;
    } catch (e) {
      el.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">Не удалось загрузить рейтинг</div></div>';
    }
  }

  loadMenu();
</script>

</body>
</html>
